<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marbles — Classic Ringer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: #e0e0e0;
    }

    #header {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f0f0f0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 15px;
    }

    .score-box .label { color: #aaa; }
    .score-box .value { font-weight: 700; font-size: 20px; color: #fff; }

    .player-indicator {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    #canvas-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.2);
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    #hud {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      padding: 8px 20px;
      font-size: 13px;
      color: #ccc;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    #message-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #message-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #message-overlay h2 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #fff;
    }

    #message-overlay p {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 24px;
    }

    #message-overlay button {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #message-overlay button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
    }

    #footer {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>MARBLES</h1>
  <div class="score-box">
    <span class="player-indicator" id="p1-dot" style="background:#e74c3c"></span>
    <span class="label">P1:</span>
    <span class="value" id="p1-score">0</span>
  </div>
  <div class="score-box">
    <span class="player-indicator" id="p2-dot" style="background:#3498db"></span>
    <span class="label">P2:</span>
    <span class="value" id="p2-score">0</span>
  </div>
  <div class="score-box">
    <span class="label">Round</span>
    <span class="value" id="round-num">1</span>
  </div>
</div>

<div id="canvas-wrapper">
  <canvas id="game"></canvas>
  <div id="hud">Drag from the shooter marble to aim — release to shoot!</div>
  <div id="message-overlay" class="visible">
    <h2>Classic Ringer</h2>
    <p>Knock marbles out of the ring to score. First to 7 wins!</p>
    <button id="start-btn">Play</button>
  </div>
</div>

<div id="footer">Click &amp; drag from the shooter to aim. Knock marbles out of the ring!</div>

<script>
// ─────────────────────────────────────────────
// MARBLES — Classic Ringer
// ─────────────────────────────────────────────

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const overlay = document.getElementById('message-overlay');
const startBtn = document.getElementById('start-btn');

// ── Sizing ──
const SIZE = Math.min(window.innerWidth - 40, window.innerHeight - 160, 700);
canvas.width = SIZE;
canvas.height = SIZE;
const CX = SIZE / 2;
const CY = SIZE / 2;
const RING_RADIUS = SIZE * 0.38;

// ── Physics constants ──
const FRICTION = 0.975;
const MIN_SPEED = 0.15;
const MAX_POWER = 18;
const MARBLE_RADIUS = SIZE * 0.018;
const SHOOTER_RADIUS = MARBLE_RADIUS * 1.4;
const RESTITUTION = 0.78;
const SUBSTEPS = 3;

// ── Marble colors ──
const TARGET_COLORS = [
  '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c',
  '#3498db', '#9b59b6', '#e84393', '#fd79a8', '#00cec9',
  '#6c5ce7', '#ffeaa7', '#dfe6e9'
];

const SHOOTER_COLORS = ['#c0392b', '#2980b9'];

// ── Game state ──
let marbles = [];
let shooter = null;
let aiming = false;
let aimStart = { x: 0, y: 0 };
let aimEnd = { x: 0, y: 0 };
let currentPlayer = 0; // 0 or 1
let scores = [0, 0];
let roundNum = 1;
let gameActive = false;
let animating = false;
let shooterPlaced = false;
let knockedOutThisTurn = 0;
let turnPhase = 'place'; // 'place', 'aim', 'moving'

// ── Audio (synthesized) ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playClick(freq = 800, duration = 0.06, vol = 0.15) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playCollision(intensity = 1) {
  const freq = 400 + Math.random() * 600;
  const dur = 0.04 + intensity * 0.04;
  playClick(freq, dur, 0.1 * intensity);
}

function playScore() {
  ensureAudio();
  [523, 659, 784].forEach((f, i) => {
    setTimeout(() => playClick(f, 0.15, 0.2), i * 100);
  });
}

// ── Marble class ──
class Marble {
  constructor(x, y, radius, color, isShooter = false) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.radius = radius;
    this.color = color;
    this.isShooter = isShooter;
    this.active = true;
    this.inRing = true;
    this.opacity = 1;
    this.glowTimer = 0;
    // Swirl pattern angles
    this.swirlAngle = Math.random() * Math.PI * 2;
    this.swirlColor = this.lightenColor(color, 40);
  }

  lightenColor(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    const r = Math.min(255, (num >> 16) + percent);
    const g = Math.min(255, ((num >> 8) & 0xff) + percent);
    const b = Math.min(255, (num & 0xff) + percent);
    return `rgb(${r},${g},${b})`;
  }

  get speed() {
    return Math.sqrt(this.vx * this.vx + this.vy * this.vy);
  }

  get isMoving() {
    return this.speed > MIN_SPEED;
  }

  update() {
    if (!this.active) return;
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= FRICTION;
    this.vy *= FRICTION;
    if (this.speed < MIN_SPEED) {
      this.vx = 0;
      this.vy = 0;
    }
    this.swirlAngle += this.speed * 0.02;

    // Boundary bounce
    if (this.x - this.radius < 0) { this.x = this.radius; this.vx = Math.abs(this.vx) * 0.7; }
    if (this.x + this.radius > SIZE) { this.x = SIZE - this.radius; this.vx = -Math.abs(this.vx) * 0.7; }
    if (this.y - this.radius < 0) { this.y = this.radius; this.vy = Math.abs(this.vy) * 0.7; }
    if (this.y + this.radius > SIZE) { this.y = SIZE - this.radius; this.vy = -Math.abs(this.vy) * 0.7; }

    // Check if in ring
    const dist = Math.sqrt((this.x - CX) ** 2 + (this.y - CY) ** 2);
    this.inRing = dist + this.radius < RING_RADIUS;
  }

  draw() {
    if (!this.active) return;
    const { x, y, radius } = this;

    ctx.save();
    ctx.globalAlpha = this.opacity;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(x + 2, y + 3, radius * 0.9, radius * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    // Base circle
    const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
    grad.addColorStop(0, this.lightenColor(this.color, 60));
    grad.addColorStop(0.5, this.color);
    grad.addColorStop(1, this.lightenColor(this.color, -40));
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Swirl pattern
    ctx.save();
    ctx.clip();
    ctx.globalAlpha = 0.25 * this.opacity;
    for (let i = 0; i < 3; i++) {
      const angle = this.swirlAngle + (i * Math.PI * 2) / 3;
      const sx = x + Math.cos(angle) * radius * 0.4;
      const sy = y + Math.sin(angle) * radius * 0.4;
      ctx.beginPath();
      ctx.arc(sx, sy, radius * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = this.swirlColor;
      ctx.fill();
    }
    ctx.restore();

    // Glass highlight
    ctx.beginPath();
    ctx.arc(x - radius * 0.25, y - radius * 0.25, radius * 0.35, 0, Math.PI * 2);
    const hlGrad = ctx.createRadialGradient(
      x - radius * 0.25, y - radius * 0.25, 0,
      x - radius * 0.25, y - radius * 0.25, radius * 0.35
    );
    hlGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hlGrad;
    ctx.fill();

    // Outline
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Glow for shooter
    if (this.isShooter && this.glowTimer > 0) {
      ctx.beginPath();
      ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${this.glowTimer * 0.5})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      this.glowTimer -= 0.02;
    }

    ctx.restore();
  }
}

// ── Collision detection ──
function resolveCollision(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.radius + b.radius;

  if (dist < minDist && dist > 0) {
    // Separate overlapping marbles
    const overlap = minDist - dist;
    const nx = dx / dist;
    const ny = dy / dist;
    a.x -= nx * overlap * 0.5;
    a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5;
    b.y += ny * overlap * 0.5;

    // Relative velocity
    const dvx = a.vx - b.vx;
    const dvy = a.vy - b.vy;
    const dvDotN = dvx * nx + dvy * ny;

    if (dvDotN > 0) {
      // Mass proportional to radius^2
      const ma = a.radius * a.radius;
      const mb = b.radius * b.radius;
      const impulse = (2 * dvDotN) / (ma + mb) * RESTITUTION;

      a.vx -= impulse * mb * nx;
      a.vy -= impulse * mb * ny;
      b.vx += impulse * ma * nx;
      b.vy += impulse * ma * ny;

      const intensity = Math.min(1, dvDotN / 8);
      playCollision(intensity);
      return true;
    }
  }
  return false;
}

// ── Particles ──
let particles = [];

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
    this.life = 1;
    this.decay = 0.02 + Math.random() * 0.03;
    this.radius = 2 + Math.random() * 3;
    this.color = color;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.life -= this.decay;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.life * 0.6;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// ── Setup ──
function setupMarbles() {
  marbles = [];
  // Classic cross pattern: 13 marbles in a + shape
  const spacing = MARBLE_RADIUS * 3.5;
  const positions = [];

  // Horizontal line (5 marbles)
  for (let i = -2; i <= 2; i++) {
    positions.push({ x: CX + i * spacing, y: CY });
  }
  // Vertical line (4 more, excluding center)
  for (let i = -2; i <= 2; i++) {
    if (i !== 0) positions.push({ x: CX, y: CY + i * spacing });
  }
  // Diagonal fills (4 more for a denser pattern)
  positions.push({ x: CX - spacing, y: CY - spacing });
  positions.push({ x: CX + spacing, y: CY - spacing });
  positions.push({ x: CX - spacing, y: CY + spacing });
  positions.push({ x: CX + spacing, y: CY + spacing });

  positions.forEach((pos, i) => {
    marbles.push(new Marble(pos.x, pos.y, MARBLE_RADIUS, TARGET_COLORS[i % TARGET_COLORS.length]));
  });
}

function placeShooter(x, y) {
  // Shooter must be placed outside the ring
  const dist = Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
  if (dist < RING_RADIUS + SHOOTER_RADIUS) {
    // Push to ring edge
    const angle = Math.atan2(y - CY, x - CX);
    x = CX + Math.cos(angle) * (RING_RADIUS + SHOOTER_RADIUS + 5);
    y = CY + Math.sin(angle) * (RING_RADIUS + SHOOTER_RADIUS + 5);
  }
  // Keep in bounds
  x = Math.max(SHOOTER_RADIUS, Math.min(SIZE - SHOOTER_RADIUS, x));
  y = Math.max(SHOOTER_RADIUS, Math.min(SIZE - SHOOTER_RADIUS, y));

  shooter = new Marble(x, y, SHOOTER_RADIUS, SHOOTER_COLORS[currentPlayer], true);
  shooter.glowTimer = 1;
  shooterPlaced = true;
  turnPhase = 'aim';
  updateHud();
}

function resetShooterForTurn() {
  shooterPlaced = false;
  shooter = null;
  turnPhase = 'place';
  updateHud();
}

// ── Drawing ──
function drawBackground() {
  // Ground
  const bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, SIZE * 0.8);
  bgGrad.addColorStop(0, '#4a7c59');
  bgGrad.addColorStop(0.7, '#3a6349');
  bgGrad.addColorStop(1, '#2d4f3a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Ground texture (pre-rendered)
  if (drawBackground.texCanvas) {
    ctx.drawImage(drawBackground.texCanvas, 0, 0);
  }

  // Ring
  ctx.beginPath();
  ctx.arc(CX, CY, RING_RADIUS, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 8]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ring fill hint
  ctx.beginPath();
  ctx.arc(CX, CY, RING_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fill();
}

function drawAimLine() {
  if (!aiming || !shooter) return;

  const dx = aimStart.x - aimEnd.x;
  const dy = aimStart.y - aimEnd.y;
  const power = Math.min(Math.sqrt(dx * dx + dy * dy), MAX_POWER * 10);
  const angle = Math.atan2(dy, dx);

  // Power bar
  const powerPct = power / (MAX_POWER * 10);

  // Draw dotted trajectory
  ctx.save();
  ctx.globalAlpha = 0.5;
  const dotCount = 15;
  for (let i = 1; i <= dotCount; i++) {
    const t = i / dotCount;
    const px = shooter.x + Math.cos(angle) * power * t * 3;
    const py = shooter.y + Math.sin(angle) * power * t * 3;
    ctx.beginPath();
    ctx.arc(px, py, 2 * (1 - t * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - t)})`;
    ctx.fill();
  }
  ctx.restore();

  // Draw power indicator arc around shooter
  ctx.beginPath();
  ctx.arc(shooter.x, shooter.y, SHOOTER_RADIUS + 8, angle - 0.5, angle + 0.5);
  const powerColor = powerPct < 0.5 ? '#2ecc71' : powerPct < 0.8 ? '#f39c12' : '#e74c3c';
  ctx.strokeStyle = powerColor;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Power label
  ctx.fillStyle = '#fff';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.round(powerPct * 100)}%`, shooter.x, shooter.y + SHOOTER_RADIUS + 22);
}

function drawCurrentPlayerIndicator() {
  if (!shooter || turnPhase === 'moving') return;
  ctx.save();
  ctx.fillStyle = SHOOTER_COLORS[currentPlayer];
  ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
  ctx.beginPath();
  ctx.arc(shooter.x, shooter.y - SHOOTER_RADIUS - 12, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Game loop ──
function update() {
  if (!gameActive) return;

  for (let step = 0; step < SUBSTEPS; step++) {
    // Update marbles
    marbles.forEach(m => m.update());
    if (shooter && shooter.active) shooter.update();

    // Collisions between all marbles
    const all = shooter ? [...marbles.filter(m => m.active), shooter] : marbles.filter(m => m.active);
    for (let i = 0; i < all.length; i++) {
      for (let j = i + 1; j < all.length; j++) {
        resolveCollision(all[i], all[j]);
      }
    }
  }

  // Check for marbles knocked out of ring
  if (turnPhase === 'moving') {
    marbles.forEach(m => {
      if (m.active && !m.inRing) {
        // Check if it was previously in the ring (just knocked out)
        const dist = Math.sqrt((m.x - CX) ** 2 + (m.y - CY) ** 2);
        if (dist > RING_RADIUS + m.radius * 5) {
          m.active = false;
          scores[currentPlayer]++;
          knockedOutThisTurn++;
          spawnParticles(m.x, m.y, m.color, 16);
          playScore();
          updateScoreboard();
        }
      }
    });

    // Check if all marbles stopped
    const anyMoving = marbles.some(m => m.active && m.isMoving) ||
                      (shooter && shooter.active && shooter.isMoving);

    if (!anyMoving) {
      endTurn();
    }
  }

  // Update particles
  particles = particles.filter(p => {
    p.update();
    return p.life > 0;
  });
}

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  drawBackground();

  // Draw target marbles
  marbles.forEach(m => m.draw());

  // Draw shooter
  if (shooter) {
    shooter.draw();
    drawCurrentPlayerIndicator();
  }

  // Aim line
  drawAimLine();

  // Particles
  particles.forEach(p => p.draw());

  // Placement guide
  if (turnPhase === 'place' && !shooterPlaced) {
    ctx.save();
    ctx.globalAlpha = 0.15 + Math.sin(Date.now() * 0.004) * 0.05;
    ctx.beginPath();
    ctx.arc(CX, CY, RING_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 20;
    ctx.stroke();
    ctx.restore();

    // "Click outside ring" text
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Click outside the ring to place your shooter', CX, SIZE - 30);
    ctx.restore();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ── Turn management ──
function endTurn() {
  turnPhase = 'done';

  // Remove shooter
  if (shooter) {
    // If shooter is still in the ring, the player keeps shooting from there (traditional rules)
    // For simplicity, we reset each turn
  }

  // Check win condition
  const remaining = marbles.filter(m => m.active).length;

  if (remaining === 0 || scores[0] >= 7 || scores[1] >= 7) {
    endGame();
    return;
  }

  // If player knocked out marbles, they get another turn (traditional rules)
  if (knockedOutThisTurn > 0) {
    knockedOutThisTurn = 0;
    resetShooterForTurn();
    updateHud();
    return;
  }

  // Switch player
  currentPlayer = 1 - currentPlayer;
  knockedOutThisTurn = 0;
  resetShooterForTurn();
  updateHud();
}

function endGame() {
  gameActive = false;
  const winner = scores[0] > scores[1] ? 1 : scores[1] > scores[0] ? 2 : 0;
  const h2 = overlay.querySelector('h2');
  const p = overlay.querySelector('p');
  const btn = overlay.querySelector('button');

  if (winner === 0) {
    h2.textContent = "It's a Draw!";
  } else {
    h2.textContent = `Player ${winner} Wins!`;
    h2.style.color = winner === 1 ? '#e74c3c' : '#3498db';
  }
  p.textContent = `Final Score: P1 ${scores[0]} — P2 ${scores[1]}`;
  btn.textContent = 'Play Again';
  overlay.classList.add('visible');
}

function startGame() {
  scores = [0, 0];
  currentPlayer = 0;
  roundNum = 1;
  knockedOutThisTurn = 0;
  particles = [];
  overlay.classList.remove('visible');
  overlay.querySelector('h2').style.color = '#fff';

  setupMarbles();
  resetShooterForTurn();
  gameActive = true;
  updateScoreboard();
}

function updateScoreboard() {
  document.getElementById('p1-score').textContent = scores[0];
  document.getElementById('p2-score').textContent = scores[1];
  document.getElementById('round-num').textContent = roundNum;
  // Highlight active player
  document.getElementById('p1-dot').style.boxShadow = currentPlayer === 0 ? '0 0 8px #e74c3c' : 'none';
  document.getElementById('p2-dot').style.boxShadow = currentPlayer === 1 ? '0 0 8px #3498db' : 'none';
}

function updateHud() {
  if (turnPhase === 'place') {
    hud.textContent = `Player ${currentPlayer + 1}: Click outside the ring to place your shooter`;
  } else if (turnPhase === 'aim') {
    hud.textContent = `Player ${currentPlayer + 1}: Drag from the shooter to aim — release to shoot!`;
  } else if (turnPhase === 'moving') {
    hud.textContent = 'Marbles in motion...';
  }
  updateScoreboard();
}

// ── Input handling ──
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const touch = e.touches && e.touches[0] || e.changedTouches && e.changedTouches[0];
  const clientX = touch ? touch.clientX : e.clientX;
  const clientY = touch ? touch.clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function onDown(e) {
  if (!gameActive || turnPhase === 'moving') return;
  e.preventDefault();
  const pos = getPos(e);

  if (turnPhase === 'place') {
    placeShooter(pos.x, pos.y);
    playClick(600, 0.05, 0.1);
    return;
  }

  if (turnPhase === 'aim' && shooter) {
    // Check if clicking on/near the shooter
    const dx = pos.x - shooter.x;
    const dy = pos.y - shooter.y;
    if (Math.sqrt(dx * dx + dy * dy) < SHOOTER_RADIUS * 3) {
      aiming = true;
      aimStart = { x: shooter.x, y: shooter.y };
      aimEnd = { x: pos.x, y: pos.y };
    }
  }
}

function onMove(e) {
  if (!aiming) return;
  e.preventDefault();
  const pos = getPos(e);
  aimEnd = pos;
}

function onUp(e) {
  if (!aiming || !shooter) return;
  e.preventDefault();

  const dx = aimStart.x - aimEnd.x;
  const dy = aimStart.y - aimEnd.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > 10) {
    const power = Math.min(dist / 10, MAX_POWER);
    const angle = Math.atan2(dy, dx);
    shooter.vx = Math.cos(angle) * power;
    shooter.vy = Math.sin(angle) * power;
    turnPhase = 'moving';
    playClick(500, 0.08, 0.2);
    updateHud();
  }

  aiming = false;
}

// Mouse events
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);

// Touch events
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });

// Start button
startBtn.addEventListener('click', startGame);

// ── Init ──
// Pre-render ground texture to avoid flicker
(function initGroundTexture() {
  const tc = document.createElement('canvas');
  tc.width = SIZE;
  tc.height = SIZE;
  const tctx = tc.getContext('2d');
  tctx.globalAlpha = 0.06;
  const rng = (seed) => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
  let s = 42;
  for (let i = 0; i < 300; i++) {
    s = s * 16807 % 2147483647;
    const tx = rng(s) * SIZE; s = s * 16807 % 2147483647;
    const ty = rng(s) * SIZE; s = s * 16807 % 2147483647;
    tctx.fillStyle = rng(s) > 0.5 ? '#fff' : '#000';
    tctx.fillRect(tx, ty, 1, 1);
  }
  drawBackground.texCanvas = tc;
})();

setupMarbles();
gameLoop();

</script>
</body>
</html>
