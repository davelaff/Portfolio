<title>Bonk!</title>
<style>
  :root{
    --ground:#160f2e;
    --ground-2:#241847;
    --ink:#f4ecff;
    --magenta:#ff2e88;
    --gold:#ffcc33;
    --green:#3ddc84;
    --violet:#7b2ff7;
    --muted:#a99fd0;
    --hud:#0e0920;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #33215e 0%, var(--ground-2) 42%, var(--ground) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overflow:hidden;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
  }
  /* ---------- HUD ---------- */
  .hud{
    flex:0 0 auto;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    gap:.5rem;
    padding:calc(env(safe-area-inset-top,0px) + .55rem) 1rem .55rem;
  }
  .stat{display:flex;flex-direction:column;line-height:1;}
  .stat.right{align-items:flex-end;}
  .stat .label{
    font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin-bottom:.32rem;font-weight:700;
  }
  .stat .value{
    font-family:"Arial Black","Segoe UI",system-ui,sans-serif;
    font-weight:900;font-size:1.7rem;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 18px rgba(255,46,136,.35);
  }
  .stat.score .value{color:var(--gold);text-shadow:0 0 18px rgba(255,204,51,.4);}
  .timer{
    justify-self:center;text-align:center;position:relative;
  }
  .timer .ring{display:block;}
  .timer .num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"Arial Black",system-ui,sans-serif;font-weight:900;font-size:1.5rem;
    font-variant-numeric:tabular-nums;
  }
  /* ---------- stage ---------- */
  .stage{flex:1 1 auto;position:relative;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:1.5rem;gap:1.1rem;
    background:radial-gradient(80% 60% at 50% 42%, rgba(22,15,46,.55), rgba(22,15,46,.9));
    backdrop-filter:blur(3px);
    transition:opacity .25s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none;}
  .title{
    font-family:"Arial Black",system-ui,sans-serif;font-weight:900;
    font-size:clamp(3.2rem,20vw,6rem);line-height:.82;letter-spacing:-.01em;
    margin:0;text-wrap:balance;
    background:linear-gradient(180deg,var(--gold) 0%,var(--magenta) 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(123,47,247,.45)) drop-shadow(0 0 26px rgba(255,46,136,.5));
    transform:rotate(-3deg);
  }
  .tagline{margin:0;color:var(--ink);font-size:1.05rem;max-width:22rem;line-height:1.5;}
  .tagline b{color:var(--green);}
  .tagline .bad{color:var(--magenta);}
  .legend{
    display:flex;gap:1.6rem;color:var(--muted);font-size:.85rem;font-weight:600;
    margin-top:-.2rem;
  }
  .legend span{display:flex;align-items:center;gap:.5rem;}
  .dot{width:1.1rem;height:1.1rem;border-radius:50%;box-shadow:0 0 10px currentColor;}
  .dot.good{background:var(--green);color:var(--green);}
  .dot.bomb{background:var(--violet);color:var(--violet);}
  .btn{
    appearance:none;border:0;cursor:pointer;
    font-family:"Arial Black",system-ui,sans-serif;font-weight:900;
    font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;
    color:#2a0d1e;
    padding:1rem 2.6rem;border-radius:999px;
    background:linear-gradient(180deg,#ffe27a,var(--gold));
    box-shadow:0 6px 0 #b06a00,0 14px 30px rgba(255,204,51,.35);
    transition:transform .08s ease,box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b06a00,0 8px 18px rgba(255,204,51,.3);}
  .final{display:flex;gap:2.2rem;margin:.2rem 0 .1rem;}
  .final .stat .value{font-size:2.6rem;}
  .final .stat .label{text-align:center;}
  .final .stat{align-items:center;}
  .newbest{
    color:var(--gold);font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    font-size:.8rem;
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.4;}}
  .credit{
    position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + .7rem);
    left:0;right:0;text-align:center;color:var(--muted);font-size:.72rem;opacity:.7;
  }
  @media (prefers-reduced-motion:reduce){
    .title{animation:none;} .newbest{animation:none;}
    .btn{transition:none;}
  }
</style>

<div id="app">
  <div class="hud" aria-hidden="false">
    <div class="stat score"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="timer">
      <svg class="ring" width="58" height="58" viewBox="0 0 58 58">
        <circle cx="29" cy="29" r="25" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="6"/>
        <circle id="timeRing" cx="29" cy="29" r="25" fill="none" stroke="var(--magenta)"
                stroke-width="6" stroke-linecap="round"
                transform="rotate(-90 29 29)" stroke-dasharray="157" stroke-dashoffset="0"/>
      </svg>
      <span class="num" id="time">30</span>
    </div>
    <div class="stat right"><span class="label">Best</span><span class="value" id="best">0</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>

    <div class="overlay" id="startScreen">
      <h1 class="title">BONK!</h1>
      <p class="tagline">Critters pop out of the holes. <b>Tap the green ones</b> before they duck.
         Dodge the <span class="bad">purple bombs</span> — they cost you.</p>
      <div class="legend">
        <span><i class="dot good"></i>+ points</span>
        <span><i class="dot bomb"></i>bomb!</span>
      </div>
      <button class="btn" id="startBtn">Play</button>
    </div>

    <div class="overlay hidden" id="endScreen">
      <div class="newbest" id="newBest" style="visibility:hidden">★ New Best ★</div>
      <h1 class="title" style="font-size:clamp(2.4rem,14vw,4rem)">Time!</h1>
      <div class="final">
        <div class="stat score"><span class="label">Score</span><span class="value" id="finalScore">0</span></div>
        <div class="stat"><span class="label">Bonks</span><span class="value" id="finalBonks">0</span></div>
      </div>
      <button class="btn" id="againBtn">Again</button>
    </div>
  </div>
  <div class="credit">Tap fast · Best saved on this device</div>
</div>

<script>
(function(){
  "use strict";
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const timeEl  = document.getElementById('time');
  const bestEl  = document.getElementById('best');
  const ringEl  = document.getElementById('timeRing');
  const startScreen = document.getElementById('startScreen');
  const endScreen   = document.getElementById('endScreen');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBonksEl = document.getElementById('finalBonks');
  const newBestEl = document.getElementById('newBest');

  const RING_LEN = 157; // 2*pi*25
  const ROUND = 30;     // seconds
  const BEST_KEY = 'bonk.best.v1';

  let W = 0, H = 0, DPR = 1;
  let holes = [];
  let particles = [];
  let floaters = [];
  let shake = 0;
  let running = false;
  let score = 0, bonks = 0, timeLeft = ROUND;
  let best = +(localStorage.getItem(BEST_KEY) || 0);
  let lastTs = 0, spawnTimer = 0, spawnGap = 0.85, roundClock = 0;
  bestEl.textContent = best;

  /* ---------------- audio (synth, no assets) ---------------- */
  let AC = null;
  function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(type){
    const a = ac(); if(!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    if(type==='bonk'){
      o.type='square'; o.frequency.setValueAtTime(680,t);
      o.frequency.exponentialRampToValueAtTime(160,t+.12);
      g.gain.setValueAtTime(.28,t); g.gain.exponentialRampToValueAtTime(.001,t+.14);
      o.start(t); o.stop(t+.15);
    } else if(type==='bomb'){
      o.type='sawtooth'; o.frequency.setValueAtTime(180,t);
      o.frequency.exponentialRampToValueAtTime(40,t+.35);
      g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.4);
      o.start(t); o.stop(t+.4);
    } else if(type==='end'){
      const notes=[880,660,440];
      notes.forEach((f,i)=>{
        const oo=a.createOscillator(),gg=a.createGain();
        oo.connect(gg);gg.connect(a.destination);oo.type='triangle';
        oo.frequency.setValueAtTime(f,t+i*.12);
        gg.gain.setValueAtTime(.22,t+i*.12);gg.gain.exponentialRampToValueAtTime(.001,t+i*.12+.2);
        oo.start(t+i*.12);oo.stop(t+i*.12+.2);
      });
    }
  }

  /* ---------------- layout ---------------- */
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layoutHoles();
  }
  function layoutHoles(){
    // 5 holes: staggered 2-1-2 arrangement that fits portrait & landscape
    const positions = [
      {x:.24,y:.34},{x:.76,y:.34},
      {x:.50,y:.56},
      {x:.24,y:.78},{x:.76,y:.78}
    ];
    const r = Math.max(38, Math.min(W,H) * 0.13);
    holes = positions.map(p=>{
      const prev = holes.find(h=>h.px===p.x&&h.py===p.y);
      return {
        px:p.x, py:p.y, x:p.x*W, y:p.y*H, r:r,
        // critter state
        occupant:null,      // null | 'good' | 'bomb'
        rise:0,             // 0..1 how far up
        target:0,           // rise target
        life:0,             // seconds remaining up
        squash:0,           // bonk squash animation 0..1
        hitFlash:0,
        ...(prev? {occupant:prev.occupant,rise:prev.rise,target:prev.target,life:prev.life}:{})
      };
    });
  }

  /* ---------------- game flow ---------------- */
  function start(){
    ac(); if(AC && AC.state==='suspended') AC.resume();
    score=0; bonks=0; timeLeft=ROUND; roundClock=0;
    particles=[]; floaters=[]; shake=0; spawnTimer=.4; spawnGap=.85;
    holes.forEach(h=>{h.occupant=null;h.rise=0;h.target=0;h.life=0;h.squash=0;h.hitFlash=0;});
    scoreEl.textContent='0'; timeEl.textContent=ROUND; setRing(1);
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    running=true; lastTs=0;
    requestAnimationFrame(loop);
  }

  function end(){
    running=false;
    holes.forEach(h=>{h.occupant=null;h.target=0;});
    finalScoreEl.textContent=score;
    finalBonksEl.textContent=bonks;
    const isBest = score>best;
    if(isBest){ best=score; localStorage.setItem(BEST_KEY,best); bestEl.textContent=best; }
    newBestEl.style.visibility = isBest && score>0 ? 'visible':'hidden';
    endScreen.classList.remove('hidden');
    beep('end');
  }

  function setRing(frac){ ringEl.style.strokeDashoffset = String(RING_LEN*(1-frac)); }

  function spawn(){
    const free = holes.filter(h=>!h.occupant && h.rise<0.02);
    if(!free.length) return;
    const h = free[(Math.random()*free.length)|0];
    // ramp difficulty: more bombs & shorter life as time passes
    const prog = 1 - timeLeft/ROUND;
    const bombChance = 0.14 + prog*0.22;
    h.occupant = Math.random()<bombChance ? 'bomb':'good';
    h.target = 1;
    h.life = (h.occupant==='bomb'? 1.5:1.15) - prog*0.45 + Math.random()*0.25;
    h.squash = 0; h.hitFlash=0;
  }

  function retreat(h){ h.target=0; }

  /* ---------------- input ---------------- */
  function pointer(clientX,clientY){
    if(!running) return;
    const rect = cv.getBoundingClientRect();
    const x = clientX-rect.left, y = clientY-rect.top;
    // topmost risen critter under finger (search reversed for front-most)
    let hit=null,bestD=Infinity;
    for(const h of holes){
      if(!h.occupant || h.rise<0.35) continue;
      const cy = h.y - h.rise*h.r*1.15; // critter center when risen
      const dx=x-h.x, dy=y-cy;
      const rr = h.r*0.95;
      const d = dx*dx+dy*dy;
      if(d < rr*rr && d<bestD){ bestD=d; hit=h; }
    }
    if(hit){ bonk(hit,x,y); }
    else { burst(x,y,6,'rgba(255,255,255,.5)',2); } // whiff puff
  }

  function bonk(h,x,y){
    if(h.occupant==='good'){
      const pts = 1;
      score+=pts; bonks++;
      scoreEl.textContent=score;
      pop(scoreEl.parentElement);
      floaters.push(mkFloat(h.x,h.y-h.r*1.1,'+1','#ffcc33'));
      burst(h.x,h.y-h.r*0.9,18,'#3ddc84',3.2);
      h.squash=1; h.hitFlash=1; beep('bonk');
      retreat(h);
    } else {
      // bomb — penalty
      score=Math.max(0,score-3);
      scoreEl.textContent=score;
      floaters.push(mkFloat(h.x,h.y-h.r*1.1,'-3','#ff2e88'));
      burst(h.x,h.y-h.r*0.9,26,'#7b2ff7',4.5);
      burst(h.x,h.y-h.r*0.9,14,'#ff2e88',5);
      shake=Math.min(1,shake+0.9); beep('bomb');
      h.squash=1; retreat(h);
    }
  }

  /* ---------------- particles / floaters ---------------- */
  function burst(x,y,n,color,spd){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=(0.4+Math.random())*spd*60;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:1,color,
        r:2+Math.random()*3});
    }
  }
  function mkFloat(x,y,text,color){ return {x,y,text,color,life:1}; }

  function pop(el){ el.animate?.([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'}); }

  /* ---------------- update + render ---------------- */
  function loop(ts){
    if(!running) return;
    if(!lastTs) lastTs=ts;
    let dt=(ts-lastTs)/1000; lastTs=ts; if(dt>0.05) dt=0.05;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt){
    // timer
    roundClock+=dt; timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; setRing(0); timeEl.textContent='0'; end(); return; }
    timeEl.textContent = Math.ceil(timeLeft);
    setRing(timeLeft/ROUND);
    ringEl.style.stroke = timeLeft<=5 ? '#ff2e88' : (timeLeft<=10?'#ffcc33':'#ff2e88');

    // spawning, faster over time
    spawnGap = 0.82 - (1-timeLeft/ROUND)*0.42;
    spawnTimer-=dt;
    const activeCount = holes.filter(h=>h.occupant).length;
    if(spawnTimer<=0 && activeCount<3){ spawn(); spawnTimer=spawnGap*(0.7+Math.random()*0.6); }

    // holes
    for(const h of holes){
      // rise/fall easing
      const sp = 9;
      h.rise += (h.target-h.rise)*Math.min(1,dt*sp);
      if(h.target===0 && h.rise<0.03 && h.occupant){ h.occupant=null; h.rise=0; }
      if(h.occupant && h.target===1){
        h.life-=dt;
        if(h.life<=0){ retreat(h); }
      }
      if(h.squash>0) h.squash=Math.max(0,h.squash-dt*4);
      if(h.hitFlash>0) h.hitFlash=Math.max(0,h.hitFlash-dt*3);
    }

    // particles
    for(const p of particles){
      p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.5;
    }
    particles=particles.filter(p=>p.life>0);
    for(const f of floaters){ f.y-=42*dt; f.life-=dt*1.1; }
    floaters=floaters.filter(f=>f.life>0);
    if(shake>0) shake=Math.max(0,shake-dt*3);
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0){
      const m=shake*10;
      ctx.translate((Math.random()*2-1)*m,(Math.random()*2-1)*m);
    }

    // ground band behind holes
    // holes sorted by y so lower ones draw in front
    const order = holes.slice().sort((a,b)=>a.y-b.y);
    for(const h of order) drawHole(h);
    for(const h of order) drawCritter(h);

    // particles
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;

    // floaters
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 clamp(20px,6vw,34px) "Arial Black",system-ui,sans-serif';
    for(const f of floaters){
      ctx.globalAlpha=Math.max(0,f.life);
      ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.4)';
      ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function drawHole(h){
    const r=h.r;
    // shadow mound
    ctx.save();
    ctx.translate(h.x,h.y);
    // dirt rim
    const rim=ctx.createRadialGradient(0,r*0.15,r*0.2,0,r*0.15,r*1.25);
    rim.addColorStop(0,'#2c1c52'); rim.addColorStop(1,'rgba(44,28,82,0)');
    ctx.fillStyle=rim;
    ctx.beginPath(); ctx.ellipse(0,r*0.15,r*1.25,r*0.75,0,0,7); ctx.fill();
    // hole
    ctx.fillStyle='#0c0720';
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.5,0,0,7); ctx.fill();
    // inner shading
    const ig=ctx.createLinearGradient(0,-r*0.5,0,r*0.5);
    ig.addColorStop(0,'rgba(0,0,0,.55)'); ig.addColorStop(1,'rgba(123,47,247,.12)');
    ctx.fillStyle=ig;
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.5,0,0,7); ctx.fill();
    ctx.restore();
  }

  function drawCritter(h){
    if(!h.occupant || h.rise<0.02) return;
    const r=h.r;
    const rise=h.rise;
    ctx.save();
    // clip so critter emerges from the hole
    ctx.beginPath();
    ctx.rect(h.x-r*1.4, 0, r*2.8, h.y+ r*0.5);
    ctx.clip();

    const squash = h.squash;
    const bodyR = r*0.82;
    const cy = h.y - rise*r*1.15;
    const sx = 1 + squash*0.35;
    const sy = 1 - squash*0.4;
    ctx.translate(h.x,cy);
    ctx.scale(sx,sy);

    const isBomb = h.occupant==='bomb';
    // body gradient
    const g=ctx.createRadialGradient(-bodyR*0.3,-bodyR*0.4,bodyR*0.2,0,0,bodyR);
    if(isBomb){ g.addColorStop(0,'#9a5bff'); g.addColorStop(1,'#4b16a8'); }
    else { g.addColorStop(0,'#7bffb0'); g.addColorStop(1,'#20b866'); }
    ctx.fillStyle=g;
    // rounded body
    ctx.beginPath(); ctx.arc(0,0,bodyR,0,7); ctx.fill();
    // hit flash
    if(h.hitFlash>0){ ctx.globalAlpha=h.hitFlash*0.7; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,0,bodyR,0,7); ctx.fill(); ctx.globalAlpha=1; }

    if(isBomb){
      // fuse spark
      ctx.strokeStyle='#2a123f'; ctx.lineWidth=bodyR*0.12; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,-bodyR*0.9);
      ctx.quadraticCurveTo(bodyR*0.35,-bodyR*1.3,bodyR*0.1,-bodyR*1.5); ctx.stroke();
      ctx.fillStyle= (performance.now()%200<100)?'#ffcc33':'#ff2e88';
      ctx.beginPath(); ctx.arc(bodyR*0.1,-bodyR*1.55,bodyR*0.16,0,7); ctx.fill();
      // angry brows
      ctx.strokeStyle='#1c0b2e'; ctx.lineWidth=bodyR*0.14;
      ctx.beginPath(); ctx.moveTo(-bodyR*0.55,-bodyR*0.28); ctx.lineTo(-bodyR*0.15,-bodyR*0.05); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bodyR*0.55,-bodyR*0.28); ctx.lineTo(bodyR*0.15,-bodyR*0.05); ctx.stroke();
    }
    // eyes (shared)
    const eyeY=-bodyR*0.05, eyeX=bodyR*0.33, eyeR=bodyR*0.22;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-eyeX,eyeY,eyeR,0,7); ctx.arc(eyeX,eyeY,eyeR,0,7); ctx.fill();
    ctx.fillStyle='#180a2b';
    const look = squash>0? 0 : 0.06;
    ctx.beginPath(); ctx.arc(-eyeX+bodyR*look,eyeY+bodyR*0.04,eyeR*0.5,0,7);
    ctx.arc(eyeX+bodyR*look,eyeY+bodyR*0.04,eyeR*0.5,0,7); ctx.fill();
    // mouth
    ctx.strokeStyle='#180a2b'; ctx.lineWidth=bodyR*0.1; ctx.lineCap='round';
    ctx.beginPath();
    if(isBomb){ ctx.arc(0,bodyR*0.55,bodyR*0.3,Math.PI*1.15,Math.PI*1.85); }
    else if(squash>0){ ctx.arc(0,bodyR*0.28,bodyR*0.34,0,Math.PI); }
    else { ctx.arc(0,bodyR*0.3,bodyR*0.28,0.15*Math.PI,0.85*Math.PI); }
    ctx.stroke();
    // cheek shine for good
    if(!isBomb){ ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.arc(-bodyR*0.4,-bodyR*0.45,bodyR*0.14,0,7); ctx.fill(); }

    ctx.restore();
  }

  /* ---------------- events ---------------- */
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); pointer(e.clientX,e.clientY); }, {passive:false});
  cv.addEventListener('contextmenu', e=>e.preventDefault());
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
  startBtn.addEventListener('click', start);
  againBtn.addEventListener('click', start);

  // idle background render so the field isn't blank behind the menu
  function idle(){
    if(running) return;
    resizeIfNeeded();
    ctx.clearRect(0,0,W,H);
    const order=holes.slice().sort((a,b)=>a.y-b.y);
    for(const h of order) drawHole(h);
    requestAnimationFrame(idle);
  }
  let lastW=0,lastH=0;
  function resizeIfNeeded(){ if(stage.clientWidth!==lastW||stage.clientHeight!==lastH){ lastW=stage.clientWidth; lastH=stage.clientHeight; resize(); } }

  resize(); requestAnimationFrame(idle);
})();
</script>
