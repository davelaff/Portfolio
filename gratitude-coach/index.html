<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>Gratitude Coach</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --accent: #7c6af7;
      --accent2: #a594f9;
      --gold: #f5c842;
      --text: #e8e8f0;
      --text2: #9090b0;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #f87171;
      --radius: 18px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── SETUP SCREEN ── */
    #setup-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      background: var(--bg);
      z-index: 100;
      gap: 24px;
    }
    #setup-screen.hidden { display: none; }

    .setup-icon {
      font-size: 64px;
      filter: drop-shadow(0 0 20px rgba(124,106,247,0.5));
    }
    .setup-title {
      font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; line-height: 1.2;
    }
    .setup-sub {
      color: var(--text2); font-size: 15px;
      text-align: center; line-height: 1.6; max-width: 320px;
    }
    .setup-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .setup-form label { font-size: 13px; color: var(--text2); letter-spacing: 0.05em; }
    .setup-form input {
      width: 100%; padding: 14px 16px;
      background: var(--surface2); border: 1.5px solid rgba(124,106,247,0.3);
      border-radius: 12px; color: var(--text); font-size: 15px;
      outline: none; -webkit-appearance: none;
    }
    .setup-form input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--accent), #9b6af7);
      border: none; border-radius: 14px;
      color: #fff; font-size: 17px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }

    /* ── MAIN APP ── */
    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
    }
    #app.hidden { display: none; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 10px;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .header-title {
      font-size: 17px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-btn {
      background: var(--surface2); border: none;
      color: var(--text2); padding: 8px 14px;
      border-radius: 10px; font-size: 13px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .header-btn:active { opacity: 0.7; }

    /* Tab bar */
    .tabs {
      display: flex; background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .tab {
      flex: 1; padding: 12px 8px;
      background: none; border: none;
      color: var(--text2); font-size: 14px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab.active { color: var(--accent2); border-bottom: 2px solid var(--accent2); }

    /* Panels */
    .panel { flex: 1; overflow: hidden; display: none; flex-direction: column; }
    .panel.active { display: flex; }

    /* ── CHAT PANEL ── */
    #chat-messages {
      flex: 1; overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex; flex-direction: column; gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%; padding: 12px 16px;
      border-radius: var(--radius); line-height: 1.55; font-size: 15px;
      animation: msgIn 0.2s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.coach {
      background: var(--surface2); color: var(--text);
      border-bottom-left-radius: 4px; align-self: flex-start;
    }
    .msg.user {
      background: linear-gradient(135deg, #4a3f8f, #6352c0);
      color: #fff; border-bottom-right-radius: 4px; align-self: flex-end;
    }
    .msg.typing {
      background: var(--surface2); align-self: flex-start;
      display: flex; align-items: center; gap: 5px; padding: 16px 18px;
    }
    .dot { width: 7px; height: 7px; background: var(--text2); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .insight-badge {
      align-self: center; background: rgba(245,200,66,0.12);
      border: 1px solid rgba(245,200,66,0.35);
      color: var(--gold); font-size: 12px; font-weight: 500;
      padding: 6px 14px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
      max-width: 92%; text-align: center;
    }

    /* Voice / Input bar */
    .input-bar {
      padding: 12px 14px 20px; background: var(--surface);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
    }
    .text-row { display: flex; gap: 8px; align-items: flex-end; }
    #text-input {
      flex: 1; padding: 12px 14px;
      background: var(--surface2); border: 1.5px solid rgba(124,106,247,0.25);
      border-radius: 14px; color: var(--text); font-size: 15px;
      resize: none; outline: none; -webkit-appearance: none;
      max-height: 100px; min-height: 46px;
      line-height: 1.45; font-family: inherit;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-input::placeholder { color: var(--text2); }
    .send-btn {
      width: 46px; height: 46px; flex-shrink: 0;
      background: var(--accent); border: none; border-radius: 14px;
      color: #fff; font-size: 20px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
    }
    .send-btn:active { opacity: 0.8; transform: scale(0.93); }

    .voice-row { display: flex; gap: 10px; align-items: center; }
    #ptt-btn {
      flex: 1; padding: 14px;
      border: 2px solid rgba(124,106,247,0.4);
      border-radius: 14px; background: transparent;
      color: var(--text2); font-size: 15px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #ptt-btn.listening {
      background: rgba(248,113,113,0.15);
      border-color: var(--red); color: var(--red);
    }
    #ptt-btn.listening .ptt-icon { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .tts-toggle {
      width: 46px; height: 46px; flex-shrink: 0;
      background: var(--surface2); border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: var(--text2); font-size: 20px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .tts-toggle.active { background: rgba(74,222,128,0.15); border-color: var(--green); color: var(--green); }

    #status-bar {
      font-size: 12px; color: var(--text2); text-align: center;
      min-height: 16px; padding: 0 8px;
    }

    /* ── INSIGHTS PANEL ── */
    #insights-list {
      flex: 1; overflow-y: auto; padding: 16px 14px;
      display: flex; flex-direction: column; gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .insight-card {
      background: var(--surface2); border-radius: var(--radius);
      padding: 16px; border-left: 3px solid var(--gold);
      animation: msgIn 0.2s ease-out;
    }
    .insight-card.constructive { border-left-color: var(--amber); }
    .insight-meta {
      font-size: 11px; color: var(--text2);
      display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    }
    .insight-type {
      padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
    }
    .insight-type.positive { background: rgba(74,222,128,0.15); color: var(--green); }
    .insight-type.constructive { background: rgba(251,191,36,0.15); color: var(--amber); }
    .insight-text { font-size: 14px; line-height: 1.6; color: var(--text); }
    .insights-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: var(--text2); text-align: center; padding: 32px;
    }
    .insights-empty .empty-icon { font-size: 48px; opacity: 0.4; }
    .insights-footer {
      padding: 12px 14px 20px; flex-shrink: 0;
      display: flex; gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .btn-secondary {
      flex: 1; padding: 14px;
      background: var(--surface2); border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: var(--text); font-size: 14px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:active { opacity: 0.7; }

    /* ── MODAL (export / confirm) ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 500px; padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      max-height: 80vh;
    }
    .modal h3 { font-size: 18px; font-weight: 700; }
    .modal textarea {
      flex: 1; min-height: 200px; padding: 14px;
      background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: var(--text); font-size: 13px;
      font-family: monospace; resize: none; outline: none;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .modal-btns { display: flex; gap: 10px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  </style>
</head>
<body>

<!-- ── SETUP SCREEN ── -->
<div id="setup-screen">
  <div class="setup-icon">🌱</div>
  <div class="setup-title">Gratitude Coach</div>
  <p class="setup-sub">A reflective space to explore gratitude, uncover your values, and receive honest insights about your character.</p>
  <form class="setup-form" id="setup-form">
    <label for="api-key-input">ANTHROPIC API KEY</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button type="submit" class="btn-primary">Begin Session</button>
  </form>
</div>

<!-- ── MAIN APP ── -->
<div id="app" class="hidden">
  <div class="header">
    <div class="header-title">🌱 Gratitude Coach</div>
    <button class="header-btn" id="reset-btn">New Session</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-chat" onclick="switchTab('chat')">
      <span>💬</span> Conversation
    </button>
    <button class="tab" id="tab-insights" onclick="switchTab('insights')">
      <span>✨</span> Insights
      <span id="insight-count" style="background:var(--accent);color:#fff;padding:1px 7px;border-radius:10px;font-size:11px;display:none"></span>
    </button>
  </div>

  <!-- CHAT PANEL -->
  <div class="panel active" id="panel-chat">
    <div id="chat-messages"></div>
    <div class="input-bar">
      <div id="status-bar"></div>
      <div class="voice-row">
        <button id="ptt-btn" onclick="togglePTT()">
          <span class="ptt-icon">🎙</span>
          <span id="ptt-label">Tap to Talk</span>
        </button>
        <button class="tts-toggle" id="tts-btn" onclick="toggleTTS()" title="Toggle voice response">🔊</button>
      </div>
      <div class="text-row">
        <textarea id="text-input" placeholder="Or type here…" rows="1"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" onclick="sendText()">↑</button>
      </div>
    </div>
  </div>

  <!-- INSIGHTS PANEL -->
  <div class="panel" id="panel-insights">
    <div id="insights-list">
      <div class="insights-empty" id="insights-empty">
        <div class="empty-icon">✨</div>
        <p>Insights about your character will appear here as we talk.</p>
      </div>
    </div>
    <div class="insights-footer">
      <button class="btn-secondary" onclick="exportInsights()">📄 Export Reference Doc</button>
      <button class="btn-secondary" onclick="clearInsights()" style="flex:0;padding:14px 18px;color:var(--red)">🗑</button>
    </div>
  </div>
</div>

<!-- Export Modal -->
<div class="modal-overlay hidden" id="export-modal">
  <div class="modal">
    <h3>📄 Your Reference Document</h3>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="copyExport()">Copy</button>
      <button class="btn-primary" style="flex:1" onclick="closeExport()">Done</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
let apiKey = '';
let messages = [];       // {role, content} for Claude API
let insights = [];       // {text, type, timestamp}
let ttsEnabled = true;
let isListening = false;
let isSpeaking = false;
let recognition = null;
let sessionStart = new Date();

const SYSTEM_PROMPT = `You are a compassionate yet refreshingly honest gratitude coach. Your purpose is to guide the user through reflective conversations about gratitude, values, relationships, and what truly matters to them.

Your approach:
- Ask one thoughtful, probing question at a time — never multiple at once
- Listen carefully and reflect back what you hear, drawing connections across the conversation
- Celebrate genuine strengths and growth you observe (specific, not generic)
- Also gently surface blind spots, patterns, or growth edges — you are honest, not just affirming
- Be warm but real. Avoid hollow positivity. If something the user says reveals a pattern worth examining, name it kindly but directly
- Keep responses concise (2–4 sentences max before any insight) and conversational — this is spoken on a phone

INSIGHT TAGGING (important):
After any message where you observe something meaningful about the user's character, values, or patterns, append a line in this exact format:
INSIGHT[positive]: <one sentence observation>
OR
INSIGHT[constructive]: <one sentence honest growth observation>

Only include an INSIGHT line when there's genuinely something worth noting — not every message. Make insights specific to what was actually shared.

Start the first message by warmly welcoming the user and asking a single, grounding opening question about gratitude.`;

// ── INIT ───────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('gc_apikey');
  if (saved) { apiKey = saved; startApp(); }

  document.getElementById('setup-form').addEventListener('submit', e => {
    e.preventDefault();
    const key = document.getElementById('api-key-input').value.trim();
    if (!key.startsWith('sk-ant-') && !key.startsWith('sk-')) {
      alert('Please enter a valid Anthropic API key.');
      return;
    }
    apiKey = key;
    localStorage.setItem('gc_apikey', key);
    startApp();
  });

  // Restore saved state
  const savedInsights = localStorage.getItem('gc_insights');
  if (savedInsights) insights = JSON.parse(savedInsights);

  setupSpeechRecognition();
  updateTTSButton();
});

function startApp() {
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadInsightsUI();
  if (messages.length === 0) {
    openingMessage();
  }
}

// ── TABS ───────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`panel-${tab}`).classList.add('active');
}

// ── SPEECH RECOGNITION ────────────────────────────────────────────
function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('ptt-btn').style.opacity = '0.4';
    document.getElementById('ptt-btn').disabled = true;
    setStatus('Voice input not supported in this browser');
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('text-input').value = transcript;
    autoResize(document.getElementById('text-input'));
    if (e.results[e.results.length - 1].isFinal) {
      stopListening();
      if (transcript.trim()) sendText();
    }
  };

  recognition.onerror = (e) => {
    console.warn('Speech error:', e.error);
    stopListening();
    if (e.error === 'not-allowed') setStatus('Microphone permission denied');
  };

  recognition.onend = () => stopListening();
}

function togglePTT() {
  if (isListening) stopListening();
  else startListening();
}

function startListening() {
  if (!recognition || isSpeaking) return;
  // Stop any ongoing speech
  window.speechSynthesis.cancel();
  isSpeaking = false;

  isListening = true;
  document.getElementById('ptt-btn').classList.add('listening');
  document.getElementById('ptt-label').textContent = 'Listening… tap to stop';
  setStatus('🔴 Recording');
  document.getElementById('text-input').value = '';
  try { recognition.start(); } catch(e) {}
}

function stopListening() {
  isListening = false;
  document.getElementById('ptt-btn').classList.remove('listening');
  document.getElementById('ptt-label').textContent = 'Tap to Talk';
  setStatus('');
  try { recognition.stop(); } catch(e) {}
}

// ── TTS ────────────────────────────────────────────────────────────
function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  localStorage.setItem('gc_tts', ttsEnabled ? '1' : '0');
  updateTTSButton();
}

function updateTTSButton() {
  const saved = localStorage.getItem('gc_tts');
  if (saved !== null) ttsEnabled = saved === '1';
  const btn = document.getElementById('tts-btn');
  btn.classList.toggle('active', ttsEnabled);
  btn.textContent = ttsEnabled ? '🔊' : '🔇';
}

function speak(text) {
  if (!ttsEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const cleaned = text.replace(/INSIGHT\[(positive|constructive)\]:[^\n]*/gi, '').trim();
  const utter = new SpeechSynthesisUtterance(cleaned);
  utter.rate = 0.95; utter.pitch = 1.0;
  // Prefer a natural voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /Samantha|Karen|Moira|Google UK English Female|en-GB|en-US/i.test(v.name));
  if (preferred) utter.voice = preferred;
  isSpeaking = true;
  utter.onend = () => { isSpeaking = false; };
  window.speechSynthesis.speak(utter);
}

// Load voices async (Chrome requires this)
window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', () => {});

// ── MESSAGING ─────────────────────────────────────────────────────
async function openingMessage() {
  showTyping();
  try {
    const resp = await callClaude([]);
    removeTyping();
    handleCoachResponse(resp);
  } catch(e) {
    removeTyping();
    addMsg('coach', 'Hi! I had trouble connecting. Please check your API key and try again.');
  }
}

function sendText() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoResize(input);
  sendMessage(text);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
}

async function sendMessage(text) {
  addMsg('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();
  setStatus('Coach is thinking…');

  try {
    const reply = await callClaude(messages);
    removeTyping();
    setStatus('');
    handleCoachResponse(reply);
    messages.push({ role: 'assistant', content: reply });
  } catch(e) {
    removeTyping();
    setStatus('');
    addMsg('coach', 'Something went wrong. Please try again.');
    console.error(e);
  }
}

function handleCoachResponse(raw) {
  // Extract insight lines
  const insightMatch = raw.match(/INSIGHT\[(positive|constructive)\]:\s*(.+)/i);
  const displayText = raw.replace(/INSIGHT\[(positive|constructive)\]:[^\n]*/gi, '').trim();

  addMsg('coach', displayText);
  speak(displayText);

  if (insightMatch) {
    const type = insightMatch[1].toLowerCase();
    const text = insightMatch[2].trim();
    addInsight(text, type);
    // Show brief badge in chat
    addInsightBadge(type, text);
  }
}

// ── CLAUDE API ─────────────────────────────────────────────────────
async function callClaude(msgs) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 512,
      system: SYSTEM_PROMPT,
      messages: msgs.length > 0 ? msgs : [{ role: 'user', content: 'BEGIN_SESSION' }]
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${response.status}`);
  }

  const data = await response.json();
  return data.content[0].text;
}

// ── CHAT UI ────────────────────────────────────────────────────────
function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  chatContainer().appendChild(el);
  scrollChat();
}

function addInsightBadge(type, text) {
  const el = document.createElement('div');
  el.className = 'insight-badge';
  el.innerHTML = `<span>${type === 'positive' ? '💛' : '🔮'}</span><span>${text}</span>`;
  chatContainer().appendChild(el);
  scrollChat();
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg typing'; el.id = 'typing-indicator';
  el.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatContainer().appendChild(el);
  scrollChat();
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function chatContainer() { return document.getElementById('chat-messages'); }
function scrollChat() {
  const c = chatContainer();
  setTimeout(() => c.scrollTop = c.scrollHeight, 50);
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── INSIGHTS ──────────────────────────────────────────────────────
function addInsight(text, type) {
  insights.push({ text, type, timestamp: new Date().toISOString() });
  localStorage.setItem('gc_insights', JSON.stringify(insights));
  loadInsightsUI();
}

function loadInsightsUI() {
  const list = document.getElementById('insights-list');
  const empty = document.getElementById('insights-empty');
  const count = document.getElementById('insight-count');

  // Remove all cards (keep empty state)
  list.querySelectorAll('.insight-card').forEach(c => c.remove());

  if (insights.length === 0) {
    empty.style.display = 'flex';
    count.style.display = 'none';
  } else {
    empty.style.display = 'none';
    count.style.display = 'inline';
    count.textContent = insights.length;

    insights.forEach((ins, i) => {
      const card = document.createElement('div');
      card.className = `insight-card ${ins.type}`;
      const d = new Date(ins.timestamp);
      const timeStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                      ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      card.innerHTML = `
        <div class="insight-meta">
          <span class="insight-type ${ins.type}">${ins.type === 'positive' ? '💛 Strength' : '🔮 Growth Edge'}</span>
          <span>${timeStr}</span>
        </div>
        <div class="insight-text">${ins.text}</div>`;
      list.appendChild(card);
    });
  }
}

function clearInsights() {
  if (!confirm('Clear all insights?')) return;
  insights = [];
  localStorage.removeItem('gc_insights');
  loadInsightsUI();
}

function exportInsights() {
  if (insights.length === 0) {
    alert('No insights yet — keep talking to your coach!');
    return;
  }

  const positives = insights.filter(i => i.type === 'positive');
  const constructive = insights.filter(i => i.type === 'constructive');
  const now = new Date();

  let doc = `GRATITUDE COACH — CHARACTER REFERENCE\n`;
  doc += `Generated: ${now.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}\n`;
  doc += `Session started: ${sessionStart.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })}\n`;
  doc += `${'─'.repeat(45)}\n\n`;

  if (positives.length > 0) {
    doc += `STRENGTHS & VALUES\n${'─'.repeat(20)}\n`;
    positives.forEach((ins, i) => {
      const d = new Date(ins.timestamp);
      doc += `${i + 1}. ${ins.text}\n`;
      doc += `   [${d.toLocaleDateString('en-US', {month:'short', day:'numeric'})}]\n\n`;
    });
  }

  if (constructive.length > 0) {
    doc += `GROWTH EDGES\n${'─'.repeat(20)}\n`;
    constructive.forEach((ins, i) => {
      const d = new Date(ins.timestamp);
      doc += `${i + 1}. ${ins.text}\n`;
      doc += `   [${d.toLocaleDateString('en-US', {month:'short', day:'numeric'})}]\n\n`;
    });
  }

  doc += `${'─'.repeat(45)}\n`;
  doc += `Total insights: ${insights.length} (${positives.length} strengths, ${constructive.length} growth edges)\n`;
  doc += `\nGenerated by Gratitude Coach`;

  document.getElementById('export-text').value = doc;
  document.getElementById('export-modal').classList.remove('hidden');
}

function copyExport() {
  const text = document.getElementById('export-text').value;
  navigator.clipboard.writeText(text).then(() => {
    setStatus('Copied to clipboard!');
    setTimeout(() => setStatus(''), 2000);
  }).catch(() => {
    document.getElementById('export-text').select();
    document.execCommand('copy');
  });
  closeExport();
}

function closeExport() {
  document.getElementById('export-modal').classList.add('hidden');
}

// ── SESSION RESET ─────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Start a new session? Current conversation will be cleared.')) return;
  messages = [];
  sessionStart = new Date();
  document.getElementById('chat-messages').innerHTML = '';
  window.speechSynthesis && window.speechSynthesis.cancel();
  openingMessage();
});
</script>
