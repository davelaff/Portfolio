<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mosaic Landscape — Vector</title>
<style>
  body { margin: 0; padding: 20px; background: #c8c8c8; font-family: system-ui, sans-serif; }
  h2 { margin: 0 0 8px; font-size: 15px; color: #333; }
  .controls { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  button { padding: 6px 14px; cursor: pointer; border: 1px solid #666; border-radius: 3px; background: #fff; font-size: 13px; }
  button:hover { background: #eee; }
  #status { color: #555; font-size: 13px; }
  #output { line-height: 0; }
  svg { display: block; box-shadow: 3px 3px 10px rgba(0,0,0,0.35); }
</style>
</head>
<body>
<h2>Mosaic Landscape (Vector / SVG)</h2>
<div class="controls">
  <button id="btn-regen">Regenerate</button>
  <button id="btn-dl">Download SVG</button>
  <span id="status"></span>
</div>
<div id="output"></div>
<script>
'use strict';

const W = 840, H = 450;

/* ── Mulberry32 seeded PRNG ── */
function makePRNG(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── Mountain ridge ── */
function buildRidge() {
  return [
    [0,          H * 0.72],
    [W * 0.04,   H * 0.68],
    [W * 0.08,   H * 0.63],
    [W * 0.12,   H * 0.70],
    [W * 0.16,   H * 0.62],
    [W * 0.20,   H * 0.54],
    [W * 0.23,   H * 0.59],
    [W * 0.27,   H * 0.52],
    [W * 0.31,   H * 0.47],
    [W * 0.34,   H * 0.51],
    [W * 0.38,   H * 0.45],
    [W * 0.42,   H * 0.37],
    [W * 0.44,   H * 0.42],
    [W * 0.47,   H * 0.35],
    [W * 0.49,   H * 0.39],
    [W * 0.52,   H * 0.33],
    [W * 0.55,   H * 0.38],
    [W * 0.58,   H * 0.44],
    [W * 0.62,   H * 0.49],
    [W * 0.65,   H * 0.45],
    [W * 0.69,   H * 0.52],
    [W * 0.73,   H * 0.57],
    [W * 0.77,   H * 0.53],
    [W * 0.81,   H * 0.60],
    [W * 0.86,   H * 0.64],
    [W * 0.91,   H * 0.68],
    [W * 0.96,   H * 0.66],
    [W,          H * 0.72],
  ];
}

function ridgeY(x, ridge) {
  for (let i = 0; i < ridge.length - 1; i++) {
    const [x1, y1] = ridge[i], [x2, y2] = ridge[i + 1];
    if (x >= x1 && x <= x2) return y1 + (y2 - y1) * (x - x1) / (x2 - x1);
  }
  return H * 0.7;
}

function isSky(x, y, ridge) { return y < ridgeY(x, ridge); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ── Point generation ── */
function generatePoints(ridge, rng) {
  const pts = [];

  // Boundary ring to prevent open Voronoi cells
  const EN = 24;
  for (let i = 0; i <= EN; i++) {
    const t = i / EN;
    pts.push([t * W, 0], [t * W, H], [0, t * H], [W, t * H]);
  }

  // Points along mountain ridge (defines the silhouette edge)
  for (let i = 0; i < ridge.length - 1; i++) {
    const [x1, y1] = ridge[i], [x2, y2] = ridge[i + 1];
    const steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 11);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const rx = x1 + t * (x2 - x1);
      const ry = y1 + t * (y2 - y1);
      // Cluster a few points around each ridge point
      for (let k = 0; k < 2; k++) {
        const jx = (rng() - 0.5) * 16;
        const jy = (rng() - 0.5) * 10;
        pts.push([clamp(rx + jx, 1, W - 1), clamp(ry + jy, 1, H - 1)]);
      }
    }
  }

  // Sky points
  let added = 0;
  for (let tries = 0; tries < 3000 && added < 210; tries++) {
    const x = rng() * W;
    const ry = ridgeY(x, ridge);
    const y = rng() * ry;
    if (y > 0 && y < ry) { pts.push([x, y]); added++; }
  }

  // Mountain body points
  added = 0;
  for (let tries = 0; tries < 4000 && added < 300; tries++) {
    const x = rng() * W;
    const ry = ridgeY(x, ridge);
    const y = ry + rng() * (H - ry);
    if (y > ry && y < H) { pts.push([x, y]); added++; }
  }

  return pts;
}

/* ── Bowyer-Watson Delaunay triangulation ── */
function bowyer(points) {
  const n = points.length;
  const BIG = 9e5;
  const stPts = [
    [W / 2 - BIG, H / 2 - BIG],
    [W / 2,       H / 2 + BIG],
    [W / 2 + BIG, H / 2 - BIG],
  ];
  const all = [...points, ...stPts];
  const si = n, sj = n + 1, sk = n + 2;

  let tris = [[si, sj, sk]];

  for (let pi = 0; pi < n; pi++) {
    const p = points[pi];
    const bad = [], good = [];

    for (const tri of tris) {
      (inCircumcircle(all, tri, p) ? bad : good).push(tri);
    }

    // Boundary polygon of the cavity
    const bnd = [];
    for (const tri of bad) {
      for (let e = 0; e < 3; e++) {
        const e0 = tri[e], e1 = tri[(e + 1) % 3];
        let shared = false;
        for (const o of bad) {
          if (o !== tri && o.includes(e0) && o.includes(e1)) { shared = true; break; }
        }
        if (!shared) bnd.push([e0, e1]);
      }
    }

    tris = good;
    for (const [e0, e1] of bnd) tris.push([e0, e1, pi]);
  }

  return {
    all,
    tris: tris.filter(t => t[0] < n && t[1] < n && t[2] < n),
    n,
  };
}

function inCircumcircle(pts, tri, p) {
  let [A, B, C] = tri.map(i => pts[i]);
  // Ensure CCW order
  if ((B[0]-A[0])*(C[1]-A[1]) - (B[1]-A[1])*(C[0]-A[0]) < 0) [B, C] = [C, B];
  const ax = A[0]-p[0], ay = A[1]-p[1];
  const bx = B[0]-p[0], by = B[1]-p[1];
  const cx = C[0]-p[0], cy = C[1]-p[1];
  const det = ax*(by*(cx*cx+cy*cy) - cy*(bx*bx+by*by))
            - ay*(bx*(cx*cx+cy*cy) - cx*(bx*bx+by*by))
            + (ax*ax+ay*ay)*(bx*cy - by*cx);
  return det > 0;
}

function circumcenter(pts, tri) {
  const [A, B, C] = tri.map(i => pts[i]);
  const D = 2*(A[0]*(B[1]-C[1]) + B[0]*(C[1]-A[1]) + C[0]*(A[1]-B[1]));
  if (Math.abs(D) < 1e-9) return [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
  const a2 = A[0]*A[0]+A[1]*A[1], b2 = B[0]*B[0]+B[1]*B[1], c2 = C[0]*C[0]+C[1]*C[1];
  return [
    (a2*(B[1]-C[1]) + b2*(C[1]-A[1]) + c2*(A[1]-B[1])) / D,
    (a2*(C[0]-B[0]) + b2*(A[0]-C[0]) + c2*(B[0]-A[0])) / D,
  ];
}

/* ── Voronoi cells from Delaunay ── */
function voronoiCells(dt) {
  const { all, tris, n } = dt;

  // Index: which triangles touch each point
  const byPt = Array.from({length: n}, () => []);
  for (let ti = 0; ti < tris.length; ti++) {
    for (const v of tris[ti]) byPt[v].push(ti);
  }

  const centers = tris.map(t => circumcenter(all, t));

  return Array.from({length: n}, (_, i) => {
    const idxs = byPt[i];
    if (idxs.length < 2) return null;
    const p = all[i];
    const verts = idxs.map(ti => centers[ti]);
    // Sort CCW by angle around site
    verts.sort((a, b) =>
      Math.atan2(a[1]-p[1], a[0]-p[0]) - Math.atan2(b[1]-p[1], b[0]-p[0])
    );
    return verts;
  });
}

/* ── Sutherland-Hodgman clip to [0,0,W,H] ── */
function clipToRect(poly) {
  if (!poly || poly.length < 3) return null;
  const edges = [[[0,0],[W,0]], [[W,0],[W,H]], [[W,H],[0,H]], [[0,H],[0,0]]];
  let out = poly;
  for (const [a, b] of edges) {
    if (!out.length) return null;
    const inp = out; out = [];
    for (let i = 0; i < inp.length; i++) {
      const cur = inp[i], prv = inp[(i-1+inp.length)%inp.length];
      const ci = onInside(cur,a,b), pi = onInside(prv,a,b);
      if (ci) { if (!pi) out.push(edgeIntersect(prv,cur,a,b)); out.push(cur); }
      else if (pi) out.push(edgeIntersect(prv,cur,a,b));
    }
  }
  return out.length >= 3 ? out : null;
}

function onInside(p, a, b) {
  return (b[0]-a[0])*(p[1]-a[1]) - (b[1]-a[1])*(p[0]-a[0]) >= 0;
}

function edgeIntersect(p, q, a, b) {
  const dx = q[0]-p[0], dy = q[1]-p[1];
  const ex = b[0]-a[0], ey = b[1]-a[1];
  const d = dx*ey - dy*ex;
  if (Math.abs(d) < 1e-9) return p;
  const t = ((a[0]-p[0])*ey - (a[1]-p[1])*ex) / d;
  return [p[0]+t*dx, p[1]+t*dy];
}

/* ── Build SVG string ── */
function buildSVG(cells) {
  const paths = [];
  for (const cell of cells) {
    if (!cell) continue;
    const clipped = clipToRect(cell);
    if (!clipped) continue;
    const d = 'M' + clipped.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join('L') + 'Z';
    paths.push(`<path d="${d}"/>`);
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W * 1.6}" height="${H * 1.6}">
  <rect width="${W}" height="${H}" fill="white"/>
  <g fill="white" stroke="black" stroke-width="0.65" stroke-linejoin="round">
    ${paths.join('\n    ')}
  </g>
  <rect width="${W}" height="${H}" fill="none" stroke="black" stroke-width="2.2"/>
</svg>`;
}

/* ── Main ── */
let currentSeed = 7331;

function run(seed) {
  document.getElementById('status').textContent = 'Computing…';
  setTimeout(() => {
    const t0 = performance.now();
    const rng = makePRNG(seed);
    const ridge = buildRidge();
    const pts = generatePoints(ridge, rng);
    const dt = bowyer(pts);
    const cells = voronoiCells(dt);
    const svg = buildSVG(cells);
    document.getElementById('output').innerHTML = svg;
    const ms = (performance.now() - t0).toFixed(0);
    document.getElementById('status').textContent =
      `${pts.length} seed points · ${dt.tris.length} triangles · ${ms} ms`;
    currentSeed = seed;
  }, 15);
}

document.getElementById('btn-regen').onclick = () => run(Math.floor(Math.random() * 1e7));
document.getElementById('btn-dl').onclick = () => {
  const svg = document.querySelector('#output svg');
  if (!svg) return;
  const blob = new Blob([svg.outerHTML], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), {href: url, download: 'mosaic-landscape.svg'});
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};

run(currentSeed);
</script>
</body>
</html>
